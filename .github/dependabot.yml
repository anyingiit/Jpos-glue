# Source: GitHub Dependabot (official) — https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Add an entry for each package manager your project uses (see the link above).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Gradle build files. Note that jSerialComm and JavaPOS are currently vendored
  # as jars under */libs/; Dependabot cannot see those until they are declared as
  # Maven coordinates in the build scripts.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
